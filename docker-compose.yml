services:

  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./hf_cache:/app/hf_cache
    depends_on:
      redis:
        condition: service_healthy
    gpus: all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rag-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-worker
    restart: unless-stopped
    env_file:
      - .env
    command:
      - celery
      - -A
      - app.jobs.celery
      - worker
      - --loglevel=info
      - --concurrency=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./hf_cache:/app/hf_cache
    depends_on:
      redis:
        condition: service_healthy
    gpus: all

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data: