services:
  rag-api:
    build: .
    container_name: rag-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./hf_cache:/app/hf_cache
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  rag-worker:
    build: .
    container_name: rag-worker
    restart: unless-stopped
    env_file:
      - .env
    command: ["celery", "-A", "app.jobs.celery", "worker", "--loglevel=info", "--concurrency=1"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./hf_cache:/app/hf_cache
    depends_on:
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
