version: '3.8'

services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    # Allows the container to reach 'localhost' on your host machine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist HuggingFace model downloads so it doesn't re-download on restart
      - ./hf_cache:/app/hf_cache
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  rag-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-worker
    restart: unless-stopped
    env_file:
      - .env
    # Override the default CMD to run Celery instead of Uvicorn
    command: ["celery", "-A", "app.jobs.celery", "worker", "--loglevel=info", "--concurrency=1"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Share the HuggingFace cache with the API container
      - ./hf_cache:/app/hf_cache
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3