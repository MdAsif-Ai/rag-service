events { }

http {
    # 1. Define the Rate Limit Zone
    # $binary_remote_addr tracks the student's IP address.
    # zone=rag_limit:10m allocates 10MB of memory to store IP states.
    # rate=20r/s means a maximum of 20 requests per second per IP.
    limit_req_zone $binary_remote_addr zone=rag_limit:10m rate=20r/s;

    upstream rag_api_nodes {
        server 192.168.76.13:8001 max_fails=3 fail_timeout=30s;
        server 192.168.76.14:8001 max_fails=3 fail_timeout=30s;
        server 192.168.76.254:8001 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8000;
        
        location / {
            # 2. Apply the Rate Limit
            # zone=rag_limit points to the zone defined above.
            # burst=40 allows sudden spikes (like a student double-clicking) up to 40 requests.
            # nodelay means serve the burst requests immediately, don't put them in a slow queue.
            limit_req zone=rag_limit burst=40 nodelay;
            
            proxy_pass http://rag_api_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}