[project]
name = "rag-service"
version = "0.1.0"
description = "Production-grade Retrieval-Augmented Generation (RAG) service for the LMS"
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Production dependencies
dependencies = [
    # --- API & Server ---
    "fastapi>=0.110.0,<0.115.0",
    "uvicorn[standard]>=0.29.0,<0.31.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    # --- Databases & Queues ---
    "qdrant-client>=1.9.0,<2.0.0",
    "supabase>=2.5.0,<3.0.0",
    "redis>=5.0.4,<6.0.0",
    "celery[redis]>=5.4.0,<6.0.0",
    # --- HTTP Client ---
    "httpx>=0.27.0,<0.28.0",
    # --- Document Parsers ---
    "PyMuPDF>=1.24.3,<2.0.0",       # PDF
    "python-docx>=1.1.0,<2.0.0",    # DOCX
    "python-pptx>=0.6.23,<1.0.0",   # PPTX
    "openpyxl>=3.1.2,<4.0.0",       # XLSX
    "beautifulsoup4>=4.12.3,<5.0.0",# HTML
    "markdown>=3.6,<4.0",           # Markdown
    # --- File Type Detection ---
    "filetype>=1.2.0,<2.0.0",
    # --- Text Chunking & Tokenization ---
    "langchain-text-splitters>=0.0.1,<0.1.0",
    "tiktoken>=0.7.0,<0.8.0",
    # --- ML / Embeddings / Reranking ---
    "FlagEmbedding>=1.2.10,<2.0.0",
    "torch>=2.2.0,<3.0.0",
    "transformers>=4.40.0,<5.0.0",
    # --- Retry Logic ---
    "tenacity>=8.3.0,<9.0.0",
    # --- Logging ---
    "loguru>=0.7.2,<0.8.0",
    "python-multipart>=0.0.32",
    "paddlepaddle>=3.3.1",
    "paddleocr>=3.7.0",
    "docling>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.6,<0.24.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.4.0,<0.5.0",
    "mypy>=1.10.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["attr-defined", "union-attr", "no-any-return", "arg-type", "call-arg", "var-annotated", "override", "assignment", "index", "return-value"]
